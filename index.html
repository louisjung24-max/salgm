<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EDE7DC">
<title>살금살금</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{--paper:#EDE7DC;--ink:#5B5750;--line:#D8D1C4}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;background:var(--paper);touch-action:manipulation}
  body{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);display:flex;flex-direction:column}

  /* 상단 주제 버튼: 가로로 밀어서 봅니다 */
  #topics{display:flex;gap:8px;overflow-x:auto;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;scrollbar-width:none;flex-shrink:0}
  #topics::-webkit-scrollbar{display:none}
  .t{flex:0 0 auto;border:1.5px solid var(--line);border-radius:999px;padding:8px 15px;background:transparent;color:var(--ink);font-size:15px;opacity:.6;transition:opacity .4s,background .4s}
  .t.sel{opacity:1;background:#fff8;border-color:var(--ink)}

  #stage{position:relative;flex:1}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 1.6s ease}
  .card.on{opacity:1}
  .figure{width:min(56vw,290px);height:min(56vw,290px)}
  .figure svg{width:100%;height:100%;overflow:visible}
  .word{margin-top:7vh;font-size:clamp(34px,9vw,56px);font-weight:500;letter-spacing:.06em;text-align:center}
  .sub{margin-top:1.2vh;font-size:clamp(15px,4vw,20px);opacity:.55;letter-spacing:.1em}

  #handle{height:max(24px,env(safe-area-inset-bottom));flex-shrink:0}
  #settings{position:absolute;inset:0;background:rgba(237,231,220,.97);display:none;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:28px;font-size:18px}
  #settings.open{display:flex}
  #settings h2{font-size:20px;font-weight:500;letter-spacing:.08em}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip{border:1.5px solid var(--ink);border-radius:999px;padding:9px 18px;background:transparent;color:var(--ink);font-size:16px}
  .chip.sel{background:var(--ink);color:var(--paper)}
  .close{margin-top:14px;font-size:15px;opacity:.6;text-decoration:underline;background:none;border:0;color:var(--ink)}
  @media (prefers-reduced-motion:reduce){.card{transition:opacity .3s}}
</style>
</head>
<body>
<div id="topics"></div>
<div id="stage"><div class="card" id="a"></div><div class="card" id="b"></div></div>

let queue=[],idx=0,front='a',timer=null;
function build(){
  queue = P.topic==='전부' ? Object.values(DECK).flat() : DECK[P.topic].slice();
  for(let i=queue.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[queue[i],queue[j]]=[queue[j],queue[i]];}
  idx=0;
}
function show(){
  if(!queue.length) build();
  const item=queue[idx]; idx=(idx+1)%queue.length; if(idx===0) build();
  const back=front==='a'?'b':'a', e=document.getElementById(back);
  e.innerHTML=`<div class="figure">${item.fig}</div><div class="word">${item.w}</div><div class="sub">${item.s}</div>`;
  document.getElementById(front).classList.remove('on'); e.classList.add('on'); front=back;
  speak(item.w,item.s);
  clearTimeout(timer); timer=setTimeout(show,P.speed);
}
document.getElementById('stage').addEventListener('pointerdown',()=>{ if(!settings.classList.contains('open')) show(); });

// ── 상단 주제 버튼 ───────────────────────────────────────
const topics=document.getElementById('topics');
['전부',...Object.keys(DECK)].forEach(k=>{
  const b=document.createElement('button'); b.className='t'+(P.topic===k?' sel':''); b.textContent=k;
  b.onclick=()=>{P.topic=k;save();[...topics.children].forEach(c=>c.classList.toggle('sel',c.textContent===k));b.scrollIntoView({inline:'center',behavior:'smooth'});build();show();};
  topics.appendChild(b);
});
topics.querySelector('.sel')?.scrollIntoView({inline:'center'});

// ── 소리 ────────────────────────────────────────────────
const PREFER=['Yuna','유나','SunHi','선히','Google 한국의','Heami'];
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').startsWith('ko')); if(!vs.length) return;
  voice=vs.find(v=>PREFER.some(p=>v.name.includes(p))&&!v.localService)||vs.find(v=>PREFER.some(p=>v.name.includes(p)))||vs[0];
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
const player=new Audio(); player.volume=.8;
function speak(t,key){
  if(!P.sound) return; player.pause();
  const src=`audio/${key}.mp3`;
  fetch(src,{method:'HEAD'}).then(r=>{ if(r.ok){player.src=src;player.play().catch(()=>{});} else tts(t); }).catch(()=>tts(t));
}
function tts(t){
  if(!('speechSynthesis' in window)) return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=.78; u.pitch=1.15; u.volume=.8; if(voice) u.voice=voice;
  speechSynthesis.speak(u);
}

// ── 어른용 설정 (아래 가장자리 3초 길게 누르기) ──────────
const settings=document.getElementById('settings'); let hold=null; const h=document.getElementById('handle');
h.addEventListener('pointerdown',()=>{hold=setTimeout(()=>{settings.classList.add('open');clearTimeout(timer);},3000);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,()=>clearTimeout(hold)));
document.getElementById('close').onclick=()=>{settings.classList.remove('open');show();};
function chips(id,list,isSel,onPick){
  const box=document.getElementById(id); box.innerHTML='';
  list.forEach(([label,val])=>{const b=document.createElement('button');b.className='chip'+(isSel(val)?' sel':'');b.textContent=label;b.onclick=()=>{onPick(val);save();render();};box.appendChild(b);});
}
function render(){
  chips('speeds',[['느리게',12000],['보통',8000],['조금 빠르게',5000]],v=>P.speed===v,v=>P.speed=v);
  chips('sound',[['켜기',true],['끄기',false]],v=>P.sound===v,v=>P.sound=v);
}
render(); build(); show();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
